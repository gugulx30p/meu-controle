<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Controle</title>
<style>
:root{--cor-fundo:#f4f7fb;--cor-superficie:#ffffff;--cor-texto:#0d1b2a;--cor-primaria:#1e40af;--cor-venda:#14532d;--cor-compra:#9a3412;--cor-atrasado:#991b1b;--cor-sobrou:#1e40af;--cor-subiu-fundo:#dcfce7;--cor-caiu-fundo:#fef2f2;--raio:16px;--fonte:"Segoe UI",system-ui,Arial,sans-serif;--tamanho-texto:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--cor-fundo);color:var(--cor-texto);font:var(--tamanho-texto)/1.4 var(--fonte)}
main{max-width:720px;margin:0 auto;padding:16px}
h1,h2{font-size:32px;margin:8px 0 16px}
h2{margin-top:28px}
.b,.p{display:flex;align-items:center;justify-content:center;min-height:64px;margin:12px 0;padding:8px 16px;border:3px solid transparent;border-radius:var(--raio);background:var(--cor-primaria);color:#fff;font:700 24px var(--fonte);text-decoration:none;text-align:center;cursor:pointer;transition:transform .15s}
.b{width:100%}
.p{flex:1;margin:0;padding:8px;font-size:20px}
.b:active,.p:active{transform:scale(.97)}
.venda{background:var(--cor-venda)}
.compra{background:var(--cor-compra)}
.cinza{background:#fff;color:var(--cor-texto);border-color:var(--cor-texto)}
.card{background:var(--cor-superficie);border-radius:var(--raio);padding:16px;margin:12px 0;box-shadow:0 2px 6px rgba(13,27,42,.15)}
.atr{border:4px solid var(--cor-atrasado)}
.verm{color:var(--cor-atrasado);font-weight:700}
.n{font-size:32px;font-weight:700}
label{display:block;margin:14px 0;font-weight:600}
input,select{display:block;width:100%;min-height:56px;margin-top:6px;padding:8px 12px;font:20px var(--fonte);color:var(--cor-texto);background:#fff;border:2px solid var(--cor-texto);border-radius:12px}
.chk{display:flex;align-items:center;gap:12px}
.chk input{width:36px;height:36px;margin:0}
.lin{display:flex;gap:8px;margin-top:12px}
.ov{position:fixed;inset:0;background:rgba(13,27,42,.7);display:flex;align-items:center;padding:16px}
.ov .card{width:100%;max-width:520px;margin:0 auto}
.fx{padding:16px;border-radius:var(--raio);margin:12px 0;font-size:24px;font-weight:700;background:var(--cor-superficie)}
.fx.up{background:var(--cor-subiu-fundo);color:var(--cor-venda)}
.fx.dn{background:var(--cor-caiu-fundo);color:var(--cor-atrasado)}
.gl{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:4 4}
.ln{fill:none;stroke:var(--cor-primaria);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tr{stroke-dasharray:10 8;stroke-linecap:butt}
.pt{fill:var(--cor-primaria)}
.pv{fill:#fff;stroke:var(--cor-primaria);stroke-width:3}
.tv,.tm,.ts{fill:var(--cor-texto)}
.tv{font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main></main>
<script>
const MARCAS=["Avon","Natura","Eudora","De Millus","Boticário"],PADRAO={"Avon":20,"Natura":20,"Eudora":20,"De Millus":10,"Boticário":7};
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
let D,editId=null,editC=null,mes;
const $=s=>document.querySelector(s);
const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoje=()=>iso(new Date());
const somaDias=(s,n)=>{const[y,m,d]=s.split("-").map(Number);return iso(new Date(y,m-1,d+n))};
const dias=(a,b)=>{const f=s=>{const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((f(b)-f(a))/864e5)};
const br=s=>s.split("-").reverse().join("/");
const reais=c=>(c<0?"- ":"")+"R$ "+(Math.abs(c)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const valor=t=>{t=String(t).replace(/[R$\s]/g,"");if(t.includes(","))t=t.replace(/\./g,"").replace(",",".");const n=Number(t);return t&&isFinite(n)&&n>0?Math.round(n*100):0};
const plural=n=>n+" dia"+(n==1?"":"s");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const erro=t=>{$("#erro").textContent=t};

function carregar(){try{D=JSON.parse(localStorage.getItem("meucontrole"))}catch(x){}
D=D||{};D.clientes=D.clientes||[];D.vendas=D.vendas||[];D.compras=D.compras||[];D.descontos=Object.assign({},PADRAO,D.descontos);D.ultimaCopia=D.ultimaCopia||null}
function salvar(){try{localStorage.setItem("meucontrole",JSON.stringify(D))}catch(x){alert("Não consegui guardar. Chame o Gustavo.")}}

function perguntar(t,sim){const o=document.createElement("div");o.className="ov";
o.innerHTML=`<div class="card"><p>${t}</p><button class="b venda" data-x="1">Sim</button><button class="b cinza" data-x="0">Não</button></div>`;
o.onclick=ev=>{const x=ev.target.dataset.x;if(x===undefined)return;o.remove();if(x==="1")sim()};
document.body.appendChild(o);o.querySelector('[data-x="0"]').focus()}
function avisar(t){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="card"><p>${t}</p><button class="b" data-x="1">Entendi</button></div>`;o.onclick=ev=>{if(ev.target.dataset.x!==undefined)o.remove()};document.body.appendChild(o);o.querySelector("button").focus()}

function inicio(){const u=D.ultimaCopia,n=u?dias(u,hoje()):null,velha=n===null||n>7;
return `<h1>Meu Controle</h1>
<a class="b venda" href="#venda">Anotar venda</a>
<a class="b compra" href="#compra">Anotar compra</a>
<a class="b" href="#devem">Quem me deve</a>
<a class="b" href="#resumo">Resumo do mês</a>
<button class="b" style="margin-top:40px" data-a="copia">Salvar cópia</button>
<p class="${velha?"verm":""}">Última cópia: ${n===null?"nunca foi feita":n==0?"hoje":"há "+plural(n)}${velha?". Salve uma cópia hoje!":""}</p>`}

function venda(){const v=D.vendas.find(x=>x.id===editId)||{},cs=D.clientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt"));
return `<h1>${editId?"Corrigir venda":"Anotar venda"}</h1>
<label>Cliente<select id="cli">${v.cliente?"":'<option value="">Escolha o cliente</option>'}${cs.map(c=>`<option ${c.nome===v.cliente?"selected":""}>${e(c.nome)}</option>`).join("")}<option value="+">Cliente novo</option></select></label>
<label id="novo" hidden>Nome do cliente novo<input id="nome"></label>
<label>Marca<select id="marca">${MARCAS.map(m=>`<option ${m===v.marca?"selected":""}>${m}</option>`).join("")}</select></label>
<label>O que foi (se quiser)<input id="item" value="${e(v.item||"")}"></label>
<label>Preço de catálogo (R$)<input id="preco" inputmode="decimal" value="${v.precoCatalogo?(v.precoCatalogo/100).toFixed(2).replace(".",","):""}"></label>
<p id="aviso" class="n" style="font-size:24px"></p>
<label>Pagar até<input id="ate" type="date" value="${v.pagarAte||somaDias(hoje(),30)}"></label>
<label class="chk"><input id="rec" type="checkbox" ${v.recebido?"checked":""}> Já recebi</label>
<p id="erro" class="verm"></p>
<button class="b venda" data-a="salvarVenda">Salvar</button><a class="b cinza" href="#">Voltar</a>`}

function aviso(){if(!$("#aviso"))return;const s=$("#cli").value,m=$("#marca").value,p=valor($("#preco").value),c=D.clientes.find(x=>x.nome===s),r=c&&c.tipo==="revendedora",d=r?D.descontos[m]:0;
$("#novo").hidden=s!=="+";
$("#aviso").textContent=!p?"":(r?`Revendedora: desconto de ${d}%. Valor a cobrar: `:"Valor a cobrar: ")+reais(Math.round(p*(100-d)/100))}

function compra(){const c=D.compras.find(x=>x.id===editC)||{};return `<h1>${editC?"Corrigir compra":"Anotar compra"}</h1>
<label>Marca<select id="marca">${MARCAS.map(m=>`<option ${m===c.marca?"selected":""}>${m}</option>`).join("")}</select></label>
<label>O que foi (se quiser)<input id="item" value="${e(c.item||"")}"></label>
<label>Quanto eu paguei (R$)<input id="preco" inputmode="decimal" value="${c.valorPago?(c.valorPago/100).toFixed(2).replace(".",","):""}"></label>
<label>Data<input id="data" type="date" value="${c.data||hoje()}"></label>
<p id="erro" class="verm"></p>
<button class="b compra" data-a="salvarCompra">Salvar</button><a class="b cinza" href="#">Voltar</a>`}

function devem(){const h=hoje(),nao=D.vendas.filter(v=>!v.recebido).sort((a,b)=>a.pagarAte.localeCompare(b.pagarAte)),at=nao.filter(v=>v.pagarAte<h),no=nao.filter(v=>v.pagarAte>=h);
const L=(v,t)=>`<div class="card${t?" atr":""}"><b>${e(v.cliente)}</b>: ${reais(v.valorCobrado)}<br>${e(v.marca)}${v.item?" · "+e(v.item):""}<br>Pagar até ${br(v.pagarAte).slice(0,5)}${t?`<br><span class="verm">ATRASADO · há ${plural(dias(v.pagarAte,h))}</span>`:""}<div class="lin"><button class="p venda" data-a="recebi" data-id="${v.id}">Recebi</button><button class="p cinza" data-a="corrigir" data-id="${v.id}">Corrigir</button><button class="p cinza" data-a="apagar" data-id="${v.id}">Apagar</button></div></div>`;
return `<h1>Quem me deve</h1><h2 class="verm" style="margin-top:0">Passaram do prazo</h2>${at.length?at.map(v=>L(v,1)).join(""):"<p>Ninguém passou do prazo. Tudo em dia!</p>"}<h2>Ainda no prazo</h2>${no.length?no.map(v=>L(v,0)).join(""):"<p>Ninguém no prazo agora.</p>"}<a class="b cinza" href="#">Voltar</a>`}

function resumo(){const[y,m]=mes.split("-"),S=(a,f)=>a.reduce((s,x)=>s+f(x),0),
ev=D.vendas.filter(v=>v.recebido&&(v.dataRecebimento||"").slice(0,7)===mes),ent=S(ev,v=>v.valorCobrado),
ec=D.compras.filter(c=>c.data.slice(0,7)===mes),sai=S(ec,c=>c.valorPago),
falta=S(D.vendas.filter(v=>!v.recebido),v=>v.valorCobrado),
K=(t,c,x)=>`<div class="card"><span style="color:${c};font-weight:700">${t}</span><br><span class="n" style="color:${c}">${reais(x)}</span></div>`;
return `<h1>Resumo do mês</h1><h2 style="margin-top:0">${MESES[m-1]} de ${y}</h2><div class="lin"><button class="p" data-a="mes" data-id="-1">◀ Mês anterior</button><button class="p" data-a="mes" data-id="1">Próximo mês ▶</button></div>${K("Entrou","var(--cor-venda)",ent)}${K("Saiu","var(--cor-compra)",sai)}${K("Sobrou","var(--cor-sobrou)",ent-sai)}${K("Ainda vou receber","var(--cor-texto)",falta)}<p>Sobrou não é lucro exato: se você comprou neste mês e vende no próximo, o resultado muda.</p><a class="b" href="#meses">Ver os meses</a><h2>O que entrou</h2>${ev.length?ev.map(v=>`<div class="card"><b>${e(v.cliente)}</b>: ${reais(v.valorCobrado)}<br>Recebido em ${br(v.dataRecebimento)}<div class="lin"><button class="p cinza" data-a="corrigir" data-id="${v.id}">Corrigir</button><button class="p cinza" data-a="apagar" data-id="${v.id}">Apagar</button></div></div>`).join(""):"<p>Nada neste mês.</p>"}<h2>O que saiu</h2>${ec.length?ec.map(c=>`<div class="card"><b>${e(c.marca)}</b>: ${reais(c.valorPago)}<br>${c.item?e(c.item)+" · ":""}${br(c.data)}<div class="lin"><button class="p cinza" data-a="corrigirC" data-id="${c.id}">Corrigir</button><button class="p cinza" data-a="apagarC" data-id="${c.id}">Apagar</button></div></div>`).join(""):"<p>Nada neste mês.</p>"}<a class="b cinza" href="#">Voltar</a>`}

function config(){return `<h1>Configurações</h1><h2>Clientes</h2>${D.clientes.map(c=>`<div class="lin" style="align-items:flex-end"><label style="flex:2;margin:0">${e(c.nome)}<select data-tipo="${e(c.nome)}"><option value="comum" ${c.tipo==="comum"?"selected":""}>Cliente comum</option><option value="revendedora" ${c.tipo==="revendedora"?"selected":""}>Revendedora</option></select></label><button class="p cinza" data-a="apagarCli" data-id="${e(c.nome)}">Apagar</button></div>`).join("")}
<label>Novo cliente<input id="nc" placeholder="Nome"></label><button class="b" data-a="addCli">Adicionar</button>
<h2>Desconto das revendedoras (%)</h2>${MARCAS.map(m=>`<label>${m}<input type="number" data-desc="${m}" min="0" max="${m==="De Millus"?15:100}" value="${D.descontos[m]}"></label>`).join("")}
<h2>Recuperar cópia</h2><input type="file" id="arq" accept=".json"><a class="b cinza" href="#">Voltar</a>`}

const A={
salvarVenda(){let n=$("#cli").value;if(n==="+")n=$("#nome").value.trim();const p=valor($("#preco").value),at=$("#ate").value;
if(!n)return erro("Faltou escolher o cliente");if(!p)return erro("Faltou o valor");if(!at)return erro("Faltou a data de pagar até");
let c=D.clientes.find(x=>x.nome.toLowerCase()===n.toLowerCase());if(!c){c={nome:n,tipo:"comum"};D.clientes.push(c)}
const o=D.vendas.find(x=>x.id===editId)||{},m=$("#marca").value,d=c.tipo==="revendedora"?D.descontos[m]:0,rec=$("#rec").checked;
const r={id:o.id||uid(),cliente:c.nome,marca:m,item:$("#item").value.trim(),precoCatalogo:p,descontoAplicado:d,valorCobrado:Math.round(p*(100-d)/100),dataVenda:o.dataVenda||hoje(),pagarAte:at,recebido:rec,dataRecebimento:rec?o.dataRecebimento||hoje():null};
D.vendas=D.vendas.filter(x=>x.id!==r.id).concat(r);salvar();location.hash=""},
salvarCompra(){const p=valor($("#preco").value),d=$("#data").value;if(!p)return erro("Faltou o valor");if(!d)return erro("Faltou a data");
const o=D.compras.find(x=>x.id===editC),r={id:o?o.id:uid(),marca:$("#marca").value,item:$("#item").value.trim(),valorPago:p,data:d};D.compras=D.compras.filter(x=>x.id!==r.id).concat(r);salvar();location.hash=""},
recebi(id){perguntar("Marcar como recebido?",()=>{const v=D.vendas.find(x=>x.id===id);v.recebido=true;v.dataRecebimento=hoje();salvar();route()})},
corrigir(id){editId=id;location.hash="#venda"},
apagarCli(n){const c=D.clientes.find(x=>x.nome===n);if(!c)return;
const vs=D.vendas.filter(v=>v.cliente===n),ab=vs.filter(v=>!v.recebido).length,k=vs.length;
if(k)return avisar(`${e(n)} tem ${k} venda${k>1?"s":""} anotada${k>1?"s":""} (${ab?ab+" ainda a receber":"todas já recebidas"}) e não pode ser apagado. Mude essas vendas para outro cliente ou apague as vendas primeiro.`);
perguntar(`Apagar ${c.tipo==="revendedora"?"a revendedora":"o cliente"} ${e(n)}? Não dá para desfazer.`,()=>{D.clientes=D.clientes.filter(x=>x!==c);salvar();route()})},corrigirC(id){editC=id;location.hash="#compra"},apagarC(id){perguntar("Tem certeza que quer apagar?",()=>{D.compras=D.compras.filter(x=>x.id!==id);salvar();route()})},
apagar(id){perguntar("Tem certeza que quer apagar?",()=>{D.vendas=D.vendas.filter(x=>x.id!==id);salvar();route()})},
copia(){D.ultimaCopia=hoje();salvar();const u=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"})),a=document.createElement("a");
a.href=u;a.download="controle-"+hoje()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);route()},
mes(d){const[y,m]=mes.split("-").map(Number),n=new Date(y,m-1+Number(d),1);mes=n.getFullYear()+"-"+pad(n.getMonth()+1);route()},
addCli(){const n=$("#nc").value.trim();if(n&&!D.clientes.some(c=>c.nome.toLowerCase()===n.toLowerCase())){D.clientes.push({nome:n,tipo:"comum"});salvar()}route()}
};

const ri=c=>"R$ "+Math.round(c/100).toLocaleString("pt-BR");
const rot=(x,c)=>c?MESES[x.m].slice(0,3):MESES[x.m];
function dadosMeses(){const ch=s=>(s||"").slice(0,7),agora=hoje().slice(0,7),r=[];
D.vendas.forEach(v=>{r.push(ch(v.dataVenda));if(v.recebido)r.push(ch(v.dataRecebimento))});D.compras.forEach(c=>r.push(ch(c.data)));
const prim=r.filter(Boolean).sort()[0]||agora,[y,m]=agora.split("-").map(Number),L=[];
for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1),k=d.getFullYear()+"-"+pad(d.getMonth()+1);
if(k>=prim)L.push({k,m:d.getMonth(),a:d.getFullYear(),at:i==0,v:D.vendas.filter(x=>x.recebido&&ch(x.dataRecebimento)===k).reduce((s,x)=>s+x.valorCobrado,0)})}
return L}
function svgMeses(L,W){const cel=innerWidth<560,fs=cel?16:18,H=350,ml=cel?24:62,mr=cel?46:52,mt=34,mb=76,n=L.length,yb=H-mb,mx=Math.max(...L.map(x=>x.v))/100||400;
let p=1;while(p*4<mx)p*=10;
const st=[p/10,p/5,p/4,p/2,p].find(s=>s*4>=mx),top=st*4,X=i=>ml+i*(W-ml-mr)/(n-1),Y=v=>mt+(yb-mt)*(1-v/100/top),
P=L.map((x,i)=>X(i).toFixed(1)+","+Y(x.v).toFixed(1)),nf=v=>Math.round(v).toLocaleString("pt-BR");
let g="",t="",prev=null;
for(let i=0;i<=4;i++){const y=(yb-(yb-mt)*i/4).toFixed(1);g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/>`+(cel?"":`<text class="ts" x="${ml-10}" y="${+y+6}" text-anchor="end" style="font-size:${fs}px">${nf(st*i)}</text>`)}
L.forEach((x,i)=>{const cx=X(i),cy=Y(x.v),s=(cel?"":"R$ ")+nf(x.v/100),w=s.length*fs*.6;let ab=cy>mt+4;
if(ab&&prev&&prev.ab&&cx-prev.cx<(w+prev.w)/2+4&&Math.abs(cy-prev.cy)<fs+6&&cy<yb-fs-24)ab=false;prev={cx,cy,w,ab};
t+=`<text class="tv" x="${cx.toFixed(1)}" y="${ab?cy-12:cy+fs+12}" text-anchor="middle" style="font-size:${fs}px">${s}</text>`;
const ls=[rot(x,cel)];if(x.m==0)ls.push(x.a);if(x.at)ls.push("(até agora)");
ls.forEach((l,k)=>{t+=`<text class="tm" x="${cx.toFixed(1)}" y="${yb+fs+10+k*(fs+4)}" text-anchor="middle" style="font-size:${fs}px;font-weight:${x.at&&k==0?700:400}">${l}</text>`})});
const pts=L.map((x,i)=>`<circle class="${x.at?"pv":"pt"}" cx="${X(i).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="${x.at?7:6}"/>`).join(""),full=P.slice(0,-1);
return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;max-width:100%;height:auto" role="img" aria-label="Dinheiro que entrou por mês: ${L.map(x=>rot(x)+" "+ri(x.v)).join(", ")}"><defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--cor-primaria);stop-opacity:.25"/><stop offset="1" style="stop-color:var(--cor-primaria);stop-opacity:0"/></linearGradient></defs>${g}<path d="M${X(0)},${yb} L${P.join(" L")} L${X(n-1)},${yb} Z" fill="url(#gd)"/>${full.length>1?`<polyline class="ln" points="${full.join(" ")}"/>`:""}<polyline class="ln tr" points="${P[n-2]} ${P[n-1]}"/>${pts}${t}</svg>`}
function fraseMeses(L){const c=L.filter(x=>!x.at),u=c[c.length-1],q=c[c.length-2],a=L[L.length-1],nm=x=>MESES[x.m];let h;
if(!q)h=`<div class="fx">${nm(u)}: ${ri(u.v)}</div>`;
else{const d=u.v-q.v,cl=Math.abs(d)<100?"":d>0?" up":" dn",tx=!cl?"ficou igual a":d>0?"▲ subiu "+ri(d)+" em relação a":"▼ caiu "+ri(-d)+" em relação a";
h=`<div class="fx${cl}">${nm(u)}: ${tx} ${nm(q).toLowerCase()}</div>`}
return h+`<p>${nm(a)} até agora: ${ri(a.v)}</p>`}
function meses(){const L=dadosMeses(),cab=`<h1>Meses</h1><p style="margin-top:-8px">Dinheiro que entrou por mês</p>`,vo=`<a class="b cinza" href="#resumo">Voltar</a>`;
if(L.length<2)return cab+`<div class="card">Quando houver mais meses anotados, o gráfico aparece aqui.</div>`+vo;
const W=Math.max(260,Math.floor($("main").clientWidth-56));

if(t.dataset.tipo){D.clientes.find(c=>c.nome===t.dataset.tipo).tipo=t.value;salvar()}
else if(t.dataset.desc){D.descontos[t.dataset.desc]=Math.min(+t.max,Math.max(0,Math.round(+t.value||0)));t.value=D.descontos[t.dataset.desc];salvar()}
else if(t.id==="arq"&&t.files[0]){const f=new FileReader();f.onload=()=>{let x;try{x=JSON.parse(f.result)}catch(z){}

perguntar("Isso vai trocar tudo o que existe pelos dados da cópia. Continuar?",()=>{D=x;salvar();carregar();route()})};f.readAsText(t.files[0])}});

addEventListener("hashchange",()=>{route();scrollTo(0,0)});let rt;addEventListener("resize",()=>{if(location.hash==="#meses"){clearTimeout(rt);rt=setTimeout(route,150)}});
